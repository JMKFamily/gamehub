<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pairpaint</title>
<link rel="icon" href="data:,">

<script>(function(){var T=JSON.parse(document.getElementById("bootText").textContent),q=null,s=null;try{q=new URLSearchParams(location.search).get("lang")}catch(e){}try{s=(JSON.parse(localStorage.getItem("flow01.v1")||"null")||{}).lang}catch(e){}var l=q||s||((navigator.language||"en").toLowerCase().indexOf("ko")===0?"ko":"en");if(!T[l])l="en";var t=T[l];document.documentElement.lang=l;document.title=t.title;window.__bootLang=l;window.__bootFail=function(){var m=document.getElementById("bootMsg"),d=document.getElementById("bootErrDetail"),b=document.getElementById("bootRetry"),bt=document.getElementById("boot");if(bt)bt.classList.add("show");if(m)m.textContent=t.load_error;if(d){d.textContent=t.load_error_detail;d.hidden=false}if(b)b.hidden=false};document.addEventListener("DOMContentLoaded",function(){var m=document.getElementById("bootMsg"),b=document.getElementById("bootRetry");if(m)m.textContent=t.loading;if(b){b.innerHTML=document.getElementById("bootRetryIcon").innerHTML;b.setAttribute("aria-label",t.btn_reload);b.onclick=function(){location.reload()}}window.__bootTimer=setTimeout(function(){if(!window.__gameBooted)window.__bootFail()},15000)});})();</script>

<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cv" role="img"></canvas>

<!-- 불러오기·오류 (부트 블록 글·↻ 그림은 sync-build 가 인라인으로 넣음) -->
<div id="boot" class="screen show" role="status">
  <p id="bootMsg" class="slot head"></p>
  <p id="bootErrDetail" class="slot detail" hidden></p>
  <button id="bootRetry" class="ib" type="button" hidden></button>
</div>

<div id="title" class="screen">
  <button id="tSound" class="ib" type="button" aria-pressed="true"></button>
  <span id="tLogo" class="art" aria-hidden="true"></span>
  <h1 id="tName" class="slot"></h1>
  <p id="tTag" class="slot soft"></p>
  <canvas id="tHero" class="art" aria-hidden="true"></canvas>
  <p id="tTap" class="slot"></p>
</div>

<div id="map" class="screen">
  <button id="mSound" class="ib" type="button" aria-pressed="true"></button>
  <h2 id="mTitle" class="slot"></h2>
  <div id="mStars" role="meter" aria-valuemin="0"></div>
  <span id="mAll" class="sr" role="meter" aria-valuemin="0"></span>
  <div id="mPage"><svg id="mPath" aria-hidden="true"></svg><ol id="mNodes"></ol></div>
  <button id="mPrev" class="ib" type="button"></button>
  <div id="mTabs" role="tablist"></div>
  <button id="mNext" class="ib" type="button"></button>
  <p id="mHold" class="slot soft small" aria-hidden="true"></p>
  <button id="mGear" class="ib" type="button" aria-describedby="mHoldSr"><span class="hold" aria-hidden="true"></span></button>
  <span id="mHoldSr" class="sr"></span>
</div>

<div id="play" class="screen">
  <h2 id="pName" class="sr"></h2>
  <button id="pMap" class="ib" type="button"></button>
  <div id="pPairs" role="meter" aria-valuemin="0"></div>
  <div id="pFill" aria-hidden="true"><i id="pFillTrack"><b id="pFillBar"></b></i><span id="pFillPct"></span></div>
  <button id="pUndo" class="ib" type="button"></button>
  <button id="pHelp" class="ib" type="button"></button>
  <button id="pRestart" class="ib" type="button"></button>
  <p id="pText" class="slot"></p>
  <div id="pLive" class="sr" aria-live="polite"></div>
  <div id="pCard" class="card" hidden><span id="pCardArt" class="art" aria-hidden="true"></span><p id="pCardText" class="slot"></p></div>
</div>

<div id="result" class="screen">
  <p id="rName" class="band"></p>
  <h2 id="rTitle" class="slot" aria-live="polite"></h2>
  <div id="rBoard"></div>
  <span id="rStar" class="art" role="img"></span>
  <div id="rDots" role="meter" aria-valuemin="0"></div>
  <div id="rPct" role="meter" aria-valuemin="0" aria-valuemax="100"><b aria-hidden="true"></b></div>
  <span id="rBest" class="art" role="img" hidden></span>
  <button id="rMap" class="ib" type="button"></button>
  <button id="rNext" class="ib big" type="button"></button>
  <button id="rAgain" class="ib" type="button"></button>
</div>

<div id="guardian" class="screen">
  <div id="gScroll">
    <div id="gCol"></div>
  </div>
  <div id="gHint" aria-hidden="true" hidden><span></span></div>
  <button id="gClose" class="ib" type="button"></button>
  <div id="gConfirm" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="gConfirmText">
    <div class="mcard"><p id="gConfirmText" class="slot"></p><button id="gNo" class="tb" type="button"></button><button id="gYes" class="tb" type="button"></button></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
