<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameHub</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --fg:#e8eaf0; --muted:#9aa0ad; --accent:#7cc4ff; --border:#262a33; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 40px 16px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p.lead { margin: 0 0 32px; color: var(--muted); }
  .grid { display:grid; gap:16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  a.card { display:block; padding:20px; background:var(--card); border:1px solid var(--border); border-radius:12px; color:inherit; text-decoration:none; transition:border-color .15s; }
  a.card:hover { border-color: var(--accent); }
  .card h2 { margin:0 0 6px; font-size:18px; }
  .card p { margin:0 0 12px; color:var(--muted); font-size:14px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:12px; padding:2px 8px; border-radius:999px; background:#232834; color:var(--accent); }
  .date { font-size:12px; color:var(--muted); margin-top:10px; }
</style>
</head>
<body>
<main>
  <h1>GameHub</h1>
  <p class="lead">자동화 파이프라인으로 만들고 배포한 게임 모음</p>
  <div class="grid" id="list">불러오는 중…</div>
</main>
<script>
fetch('games.json').then(r => r.json()).then(games => {
  const list = document.getElementById('list');
  list.textContent = '';
  games.sort((a, b) => (b.released || '').localeCompare(a.released || ''));
  for (const g of games) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = g.url || `games/${g.slug}/`;
    a.innerHTML = `<h2></h2><p></p><div class="tags"></div><div class="date"></div>`;
    a.querySelector('h2').textContent = g.title;
    a.querySelector('p').textContent = g.description || '';
    const tags = a.querySelector('.tags');
    for (const t of g.tags || []) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = t; tags.append(s); }
    a.querySelector('.date').textContent = g.released || '';
    list.append(a);
  }
}).catch(() => { document.getElementById('list').textContent = 'games.json을 불러오지 못했습니다.'; });
</script>
</body>
</html>
