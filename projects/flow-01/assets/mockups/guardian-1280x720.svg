<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1039" viewBox="0 0 1280 1039" font-family="system-ui, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3EEFB"/><stop offset="1" stop-color="#E4EEFA"/></linearGradient></defs><rect width="1280" height="1039" fill="url(#bg)"/><rect x="220" y="18" width="760" height="72" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="220" y="65.55" text-anchor="start" font-size="33" font-weight="800" fill="#262B40">보호자 설정</text><rect x="220" y="108" width="840" height="344" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="220" y="132" text-anchor="start" font-size="24" font-weight="400" fill="#262B40">같은 색 점을 선으로 잇고, 빈칸 없이 판을 칠하면 끝나는 퍼즐입니다. 시간 제한과</text><text x="220" y="163.2" text-anchor="start" font-size="24" font-weight="400" fill="#262B40">실패가 없어서 천천히 생각해도 됩니다. 결과 화면의 숫자(%)는 한 번에 이은</text><text x="220" y="194.4" text-anchor="start" font-size="24" font-weight="400" fill="#262B40">색의 비율입니다. 예: 5쌍 중 4쌍을 한 번에 이으면 80%. 모두 한 번에 이으면</text><text x="220" y="225.60000000000002" text-anchor="start" font-size="24" font-weight="400" fill="#262B40">별을 받습니다(100%). 한 색을 그리다가 다른 색을 긋고 돌아와 이어 그리거나,</text><text x="220" y="256.8" text-anchor="start" font-size="24" font-weight="400" fill="#262B40">이었던 선을 지우거나 되돌린 뒤 다시 이은 색은 한 번에 이은 것으로 세지</text><text x="220" y="288" text-anchor="start" font-size="24" font-weight="400" fill="#262B40">않습니다. 다른 색을 건드리기 전에 같은 색을 고쳐 그리는 것은 한 번으로 셉니다.</text><text x="220" y="319.20000000000005" text-anchor="start" font-size="24" font-weight="400" fill="#262B40">결과 화면 점 줄의 꽉 찬 점은 한 번에 이은 색, 속 빈 점은 다시 그은 색입니다.</text><text x="220" y="350.4" text-anchor="start" font-size="24" font-weight="400" fill="#262B40">처음부터(↻)를 누르면 새로 시작해 별을 다시 받을 수 있습니다. 놀이 중 가는</text><text x="220" y="381.6" text-anchor="start" font-size="24" font-weight="400" fill="#262B40">막대와 작은 숫자는 판을 칠한 만큼입니다.</text><rect x="220" y="470" width="732" height="72" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="220" y="515.45" text-anchor="start" font-size="27" font-weight="400" fill="#262B40">소리</text><rect x="220" y="560" width="732" height="72" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="220" y="605.45" text-anchor="start" font-size="27" font-weight="400" fill="#262B40">진동</text><rect x="220" y="636" width="840" height="55" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="220" y="657" text-anchor="start" font-size="21" font-weight="400" fill="#5B6178">진동은 지원하는 기기(주로 안드로이드)에서만 나요. 진동이 없어도 소리와 그림으로 모두 알</text><text x="220" y="684.3" text-anchor="start" font-size="21" font-weight="400" fill="#5B6178">수 있어요.</text><rect x="220" y="709" width="732" height="72" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="220" y="754.45" text-anchor="start" font-size="27" font-weight="400" fill="#262B40">움직임 줄이기</text><rect x="220" y="799" width="840" height="36" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="220" y="826" text-anchor="start" font-size="27" font-weight="400" fill="#262B40">언어</text><rect x="964" y="484.4" width="96" height="43.199999999999996" rx="21.599999999999998" fill="#6474CF"/><circle cx="1038.4" cy="506" r="17.28" fill="#FFFFFF"/><rect x="964" y="574.4" width="96" height="43.199999999999996" rx="21.599999999999998" fill="#6474CF"/><circle cx="1038.4" cy="596" r="17.28" fill="#FFFFFF"/><rect x="964" y="723.4" width="96" height="43.199999999999996" rx="21.599999999999998" fill="#6474CF"/><circle cx="1038.4" cy="745" r="17.28" fill="#FFFFFF"/><rect x="220" y="841" width="141" height="72" rx="36" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="290.5" y="886.45" text-anchor="middle" font-size="27" fill="#262B40">한국어</text><rect x="373" y="841" width="141" height="72" rx="36" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="443.5" y="886.45" text-anchor="middle" font-size="27" fill="#262B40">English</text><rect x="220" y="949" width="240" height="72" rx="36" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="340" y="994.45" text-anchor="middle" font-size="27" fill="#262B40">기록 지우기</text><circle cx="1024" cy="54" r="35" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><g transform="translate(997 27) scale(1.125)"><path d="M15 15 L33 33 M33 15 L15 33" fill="none" stroke="#262B40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g><text x="6" y="1035" font-size="10" fill="#5B6178">보호자 1280x720 · 내용 높이 1039px → 세로 스크롤 · 점선 = 글 자리</text></svg>