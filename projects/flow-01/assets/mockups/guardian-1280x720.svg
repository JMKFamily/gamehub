<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="914" viewBox="0 0 1280 914" font-family="system-ui, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3EEFB"/><stop offset="1" stop-color="#E4EEFA"/></linearGradient></defs><rect width="1280" height="914" fill="url(#bg)"/><rect x="220" y="18" width="760" height="72" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="220" y="65.55" text-anchor="start" font-size="33" font-weight="800" fill="#262B40">보호자 설정</text><rect x="220" y="108" width="840" height="219" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="220" y="132" text-anchor="start" font-size="24" font-weight="400" fill="#262B40">같은 색 점을 선으로 잇고, 빈칸 없이 판을 칠하면 끝나는 퍼즐입니다. 시간 제한과</text><text x="220" y="163.2" text-anchor="start" font-size="24" font-weight="400" fill="#262B40">실패가 없어서 천천히 생각해도 됩니다. 결과 화면의 %는 한 번에 이은 색의</text><text x="220" y="194.4" text-anchor="start" font-size="24" font-weight="400" fill="#262B40">비율입니다. 예를 들어 5쌍 중 4쌍을 한 번에 이으면 80 %이고, 모두 한 번에</text><text x="220" y="225.60000000000002" text-anchor="start" font-size="24" font-weight="400" fill="#262B40">이으면 100 %로 별을 받습니다. 이었다가 지우고 다시 이은 색은 한 번에 이은</text><text x="220" y="256.8" text-anchor="start" font-size="24" font-weight="400" fill="#262B40">것으로 세지 않습니다. 놀이 중 칭찬 아래 작은 %는 판을 칠한 만큼입니다.</text><rect x="220" y="345" width="732" height="72" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="220" y="390.45" text-anchor="start" font-size="27" font-weight="400" fill="#262B40">소리</text><rect x="220" y="435" width="732" height="72" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="220" y="480.45" text-anchor="start" font-size="27" font-weight="400" fill="#262B40">진동</text><rect x="220" y="511" width="840" height="55" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="220" y="532" text-anchor="start" font-size="21" font-weight="400" fill="#5B6178">진동은 지원하는 기기(주로 안드로이드)에서만 나요. 진동이 없어도 소리와 그림으로 모두 알</text><text x="220" y="559.3" text-anchor="start" font-size="21" font-weight="400" fill="#5B6178">수 있어요.</text><rect x="220" y="584" width="732" height="72" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="220" y="629.45" text-anchor="start" font-size="27" font-weight="400" fill="#262B40">움직임 줄이기</text><rect x="220" y="674" width="840" height="36" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="220" y="701" text-anchor="start" font-size="27" font-weight="400" fill="#262B40">언어</text><rect x="964" y="359.4" width="96" height="43.199999999999996" rx="21.599999999999998" fill="#6474CF"/><circle cx="1038.4" cy="381" r="17.28" fill="#FFFFFF"/><rect x="964" y="449.4" width="96" height="43.199999999999996" rx="21.599999999999998" fill="#6474CF"/><circle cx="1038.4" cy="471" r="17.28" fill="#FFFFFF"/><rect x="964" y="598.4" width="96" height="43.199999999999996" rx="21.599999999999998" fill="#6474CF"/><circle cx="1038.4" cy="620" r="17.28" fill="#FFFFFF"/><rect x="220" y="716" width="141" height="72" rx="36" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="290.5" y="761.45" text-anchor="middle" font-size="27" fill="#262B40">한국어</text><rect x="373" y="716" width="141" height="72" rx="36" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="443.5" y="761.45" text-anchor="middle" font-size="27" fill="#262B40">English</text><rect x="220" y="824" width="240" height="72" rx="36" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="340" y="869.45" text-anchor="middle" font-size="27" fill="#262B40">기록 지우기</text><circle cx="1024" cy="54" r="35" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><g transform="translate(997 27) scale(1.125)"><path d="M15 15 L33 33 M33 15 L15 33" fill="none" stroke="#262B40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g><text x="6" y="910" font-size="10" fill="#5B6178">보호자 1280x720 · 내용 높이 914px → 세로 스크롤 · 점선 = 글 자리</text></svg>