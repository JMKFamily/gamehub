<svg xmlns="http://www.w3.org/2000/svg" width="360" height="881" viewBox="0 0 360 881" font-family="system-ui, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3EEFB"/><stop offset="1" stop-color="#E4EEFA"/></linearGradient></defs><rect width="360" height="881" fill="url(#bg)"/><rect x="16" y="12" width="272" height="48" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="43.7" text-anchor="start" font-size="22" font-weight="800" fill="#262B40">보호자 설정</text><rect x="16" y="72" width="328" height="396" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="88" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">같은 색 점을 선으로 잇고, 빈칸 없이 판을</text><text x="16" y="108.8" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">칠하면 끝나는 퍼즐입니다. 시간 제한과 실패가</text><text x="16" y="129.6" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">없어서 천천히 생각해도 됩니다. 결과 화면의</text><text x="16" y="150.4" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">숫자(%)는 한 번에 이은 색의 비율입니다. 예:</text><text x="16" y="171.2" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">5쌍 중 4쌍을 한 번에 이으면 80%. 모두 한 번에</text><text x="16" y="192" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">이으면 별을 받습니다(100%). 한 색을</text><text x="16" y="212.8" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">그리다가 다른 색을 긋고 돌아와 이어 그리거나,</text><text x="16" y="233.6" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">이었던 선을 지우거나 되돌린 뒤 다시 이은 색은</text><text x="16" y="254.4" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">한 번에 이은 것으로 세지 않습니다. 다른 색을</text><text x="16" y="275.20000000000005" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">건드리기 전에 같은 색을 고쳐 그리는 것은 한</text><text x="16" y="296" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">번으로 셉니다. 결과 화면 점 줄의 꽉 찬 점은 한</text><text x="16" y="316.8" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">번에 이은 색, 속 빈 점은 다시 그은 색입니다.</text><text x="16" y="337.6" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">처음부터(↻)를 누르면 새로 시작해 별을 다시</text><text x="16" y="358.40000000000003" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">받을 수 있습니다. 놀이 중 가는 막대와 작은</text><text x="16" y="379.2" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">숫자는 판을 칠한 만큼입니다.</text><rect x="16" y="480" width="252" height="48" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="510.3" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">소리</text><rect x="16" y="540" width="252" height="48" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="570.3" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">진동</text><rect x="16" y="592" width="328" height="55" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="606" text-anchor="start" font-size="14" font-weight="400" fill="#5B6178">진동은 지원하는 기기(주로 안드로이드)에서만 나요.</text><text x="16" y="624.2" text-anchor="start" font-size="14" font-weight="400" fill="#5B6178">진동이 없어도 소리와 그림으로 모두 알 수 있어요.</text><rect x="16" y="659" width="252" height="48" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="689.3" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">움직임 줄이기</text><rect x="16" y="719" width="328" height="24" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="737" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">언어</text><rect x="280" y="489.6" width="64" height="28.799999999999997" rx="14.399999999999999" fill="#6474CF"/><circle cx="329.6" cy="504" r="11.52" fill="#FFFFFF"/><rect x="280" y="549.6" width="64" height="28.799999999999997" rx="14.399999999999999" fill="#6474CF"/><circle cx="329.6" cy="564" r="11.52" fill="#FFFFFF"/><rect x="280" y="668.6" width="64" height="28.799999999999997" rx="14.399999999999999" fill="#6474CF"/><circle cx="329.6" cy="683" r="11.52" fill="#FFFFFF"/><rect x="16" y="749" width="105" height="48" rx="24" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="68.5" y="779.3" text-anchor="middle" font-size="18" fill="#262B40">한국어</text><rect x="133" y="749" width="105" height="48" rx="24" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="185.5" y="779.3" text-anchor="middle" font-size="18" fill="#262B40">English</text><rect x="16" y="821" width="171" height="48" rx="24" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="101.5" y="851.3" text-anchor="middle" font-size="18" fill="#262B40">기록 지우기</text><circle cx="320" cy="36" r="23" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><g transform="translate(302 18) scale(0.750)"><path d="M15 15 L33 33 M33 15 L15 33" fill="none" stroke="#262B40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g><text x="6" y="877" font-size="10" fill="#5B6178">보호자 360x640 · 내용 높이 881px → 세로 스크롤 · 점선 = 글 자리</text></svg>