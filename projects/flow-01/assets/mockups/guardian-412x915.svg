<svg xmlns="http://www.w3.org/2000/svg" width="412" height="1072" viewBox="0 0 412 1072" font-family="system-ui, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3EEFB"/><stop offset="1" stop-color="#E4EEFA"/></linearGradient></defs><rect width="412" height="1072" fill="url(#bg)"/><rect x="16" y="14" width="317" height="55" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="50.25" text-anchor="start" font-size="25" font-weight="800" fill="#262B40">설정</text><rect x="16" y="83" width="380" height="515" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="101" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">같은 색 점을 선으로 잇고, 빈칸 없이 판을 칠하면</text><text x="16" y="124.4" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">끝나는 퍼즐이에요. 시간 제한과 실패가 없어서</text><text x="16" y="147.8" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">천천히 생각해도 돼요. 결과 화면의 숫자(%)는 한</text><text x="16" y="171.2" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">번에 이은 색의 비율이에요. 예: 5쌍 중 4쌍을 한</text><text x="16" y="194.60000000000002" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">번에 이으면 80%. 모두 한 번에 이으면 별을</text><text x="16" y="218" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">받아요(100%). 한 색을 그리다가 다른 색을 긋고</text><text x="16" y="241.4" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">돌아와 이어 그리거나, 이었던 선을 지우거나</text><text x="16" y="264.79999999999995" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">되돌린 뒤 다시 이은 색은 한 번에 이은 것으로</text><text x="16" y="288.20000000000005" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">세지 않아요. 다른 색을 건드리기 전에 같은 색을</text><text x="16" y="311.6" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">고쳐 그리는 것은 한 번으로 세어요. 결과 화면 점</text><text x="16" y="335" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">줄의 꽉 찬 점은 한 번에 이은 색, 속 빈 점은 다시</text><text x="16" y="358.40000000000003" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">그은 색이에요. 처음부터(↻)를 누르면 새로</text><text x="16" y="381.8" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">시작해 별을 다시 받을 수 있어요. 놀이 중 가는</text><text x="16" y="405.20000000000005" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">막대와 작은 숫자는 판을 칠한 만큼이에요. 별을</text><text x="16" y="428.59999999999997" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">10개 모을 때마다 큰 그림이 하나씩 열려요(모두</text><text x="16" y="452" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">5개). 큰 그림은 색이 10가지 이상이고 판이 아주</text><text x="16" y="475.40000000000003" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">넓은 어려운 판이에요.</text><rect x="16" y="612" width="295" height="55" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="646.85" text-anchor="start" font-size="21" font-weight="400" fill="#262B40">소리</text><rect x="16" y="681" width="295" height="55" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="715.85" text-anchor="start" font-size="21" font-weight="400" fill="#262B40">진동</text><rect x="16" y="740" width="380" height="63" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="756" text-anchor="start" font-size="16" font-weight="400" fill="#5B6178">진동은 지원하는 기기(주로 안드로이드)에서만 나요.</text><text x="16" y="776.8" text-anchor="start" font-size="16" font-weight="400" fill="#5B6178">진동이 없어도 소리와 그림으로 모두 알 수 있어요.</text><rect x="16" y="817" width="295" height="55" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="851.85" text-anchor="start" font-size="21" font-weight="400" fill="#262B40">움직임 줄이기</text><rect x="16" y="886" width="380" height="28" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="907" text-anchor="start" font-size="21" font-weight="400" fill="#262B40">언어</text><rect x="323" y="623" width="73" height="33" rx="16.5" fill="#6474CF"/><circle cx="379.5" cy="639.5" r="13.2" fill="#FFFFFF"/><rect x="323" y="692" width="73" height="33" rx="16.5" fill="#6474CF"/><circle cx="379.5" cy="708.5" r="13.2" fill="#FFFFFF"/><rect x="323" y="828" width="73" height="33" rx="16.5" fill="#6474CF"/><circle cx="379.5" cy="844.5" r="13.2" fill="#FFFFFF"/><rect x="16" y="920" width="117" height="55" rx="27.5" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="74.5" y="954.85" text-anchor="middle" font-size="21" fill="#262B40">한국어</text><rect x="145" y="920" width="117" height="55" rx="27.5" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="203.5" y="954.85" text-anchor="middle" font-size="21" fill="#262B40">English</text><rect x="16" y="1003" width="194" height="55" rx="27.5" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="113" y="1037.85" text-anchor="middle" font-size="21" fill="#262B40">기록 지우기</text><circle cx="368.5" cy="41.5" r="26.5" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><g transform="translate(347.875 20.875) scale(0.859)"><path d="M15 15 L33 33 M33 15 L15 33" fill="none" stroke="#262B40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g><text x="6" y="1068" font-size="10" fill="#5B6178">보호자 412x915 · 내용 높이 1072px → 세로 스크롤 · 점선 = 글 자리</text></svg>