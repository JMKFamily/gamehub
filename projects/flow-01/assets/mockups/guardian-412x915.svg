<svg xmlns="http://www.w3.org/2000/svg" width="412" height="915" viewBox="0 0 412 915" font-family="system-ui, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3EEFB"/><stop offset="1" stop-color="#E4EEFA"/></linearGradient></defs><rect width="412" height="915" fill="url(#bg)"/><rect x="16" y="14" width="317" height="55" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="50.25" text-anchor="start" font-size="25" font-weight="800" fill="#262B40">보호자 설정</text><rect x="16" y="83" width="380" height="281" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="101" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">같은 색 점을 선으로 잇고, 빈칸 없이 판을 칠하면</text><text x="16" y="124.4" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">끝나는 퍼즐입니다. 시간 제한과 실패가 없어서</text><text x="16" y="147.8" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">천천히 생각해도 됩니다. 결과 화면의 %는 한</text><text x="16" y="171.2" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">번에 이은 색의 비율입니다. 예를 들어 5쌍 중</text><text x="16" y="194.60000000000002" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">4쌍을 한 번에 이으면 80 %이고, 모두 한 번에</text><text x="16" y="218" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">이으면 100 %로 별을 받습니다. 이었다가 지우고</text><text x="16" y="241.4" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">다시 이은 색은 한 번에 이은 것으로 세지</text><text x="16" y="264.79999999999995" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">않습니다. 놀이 중 칭찬 아래 작은 %는 판을 칠한</text><text x="16" y="288.20000000000005" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">만큼입니다.</text><rect x="16" y="378" width="295" height="55" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="412.85" text-anchor="start" font-size="21" font-weight="400" fill="#262B40">소리</text><rect x="16" y="447" width="295" height="55" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="481.85" text-anchor="start" font-size="21" font-weight="400" fill="#262B40">진동</text><rect x="16" y="506" width="380" height="63" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="522" text-anchor="start" font-size="16" font-weight="400" fill="#5B6178">진동은 지원하는 기기(주로 안드로이드)에서만 나요.</text><text x="16" y="542.8" text-anchor="start" font-size="16" font-weight="400" fill="#5B6178">진동이 없어도 소리와 그림으로 모두 알 수 있어요.</text><rect x="16" y="583" width="295" height="55" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="617.85" text-anchor="start" font-size="21" font-weight="400" fill="#262B40">움직임 줄이기</text><rect x="16" y="652" width="380" height="28" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="16" y="673" text-anchor="start" font-size="21" font-weight="400" fill="#262B40">언어</text><rect x="323" y="389" width="73" height="33" rx="16.5" fill="#6474CF"/><circle cx="379.5" cy="405.5" r="13.2" fill="#FFFFFF"/><rect x="323" y="458" width="73" height="33" rx="16.5" fill="#6474CF"/><circle cx="379.5" cy="474.5" r="13.2" fill="#FFFFFF"/><rect x="323" y="594" width="73" height="33" rx="16.5" fill="#6474CF"/><circle cx="379.5" cy="610.5" r="13.2" fill="#FFFFFF"/><rect x="16" y="686" width="117" height="55" rx="27.5" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="74.5" y="720.85" text-anchor="middle" font-size="21" fill="#262B40">한국어</text><rect x="145" y="686" width="117" height="55" rx="27.5" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="203.5" y="720.85" text-anchor="middle" font-size="21" fill="#262B40">English</text><rect x="16" y="769" width="194" height="55" rx="27.5" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="113" y="803.85" text-anchor="middle" font-size="21" fill="#262B40">기록 지우기</text><circle cx="368.5" cy="41.5" r="26.5" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><g transform="translate(347.875 20.875) scale(0.859)"><path d="M15 15 L33 33 M33 15 L15 33" fill="none" stroke="#262B40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g><text x="6" y="911" font-size="10" fill="#5B6178">보호자 412x915 · 점선 = 글 자리</text></svg>