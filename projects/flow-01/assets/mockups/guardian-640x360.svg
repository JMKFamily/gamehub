<svg xmlns="http://www.w3.org/2000/svg" width="640" height="696" viewBox="0 0 640 696" font-family="system-ui, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3EEFB"/><stop offset="1" stop-color="#E4EEFA"/></linearGradient></defs><rect width="640" height="696" fill="url(#bg)"/><rect x="40" y="12" width="504" height="48" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="40" y="43.7" text-anchor="start" font-size="22" font-weight="800" fill="#262B40">보호자 설정</text><rect x="40" y="72" width="560" height="229" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="40" y="88" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">같은 색 점을 선으로 잇고, 빈칸 없이 판을 칠하면 끝나는 퍼즐입니다. 시간 제한과</text><text x="40" y="108.8" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">실패가 없어서 천천히 생각해도 됩니다. 결과 화면의 숫자(%)는 한 번에 이은</text><text x="40" y="129.6" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">색의 비율입니다. 예: 5쌍 중 4쌍을 한 번에 이으면 80%. 모두 한 번에 이으면</text><text x="40" y="150.4" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">별을 받습니다(100%). 한 색을 그리다가 다른 색을 긋고 돌아와 이어 그리거나,</text><text x="40" y="171.2" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">이었던 선을 지우거나 되돌린 뒤 다시 이은 색은 한 번에 이은 것으로 세지</text><text x="40" y="192" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">않습니다. 다른 색을 건드리기 전에 같은 색을 고쳐 그리는 것은 한 번으로 셉니다.</text><text x="40" y="212.8" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">결과 화면 점 줄의 꽉 찬 점은 한 번에 이은 색, 속 빈 점은 다시 그은 색입니다.</text><text x="40" y="233.6" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">처음부터(↻)를 누르면 새로 시작해 별을 다시 받을 수 있습니다. 놀이 중 가는</text><text x="40" y="254.4" text-anchor="start" font-size="16" font-weight="400" fill="#262B40">막대와 작은 숫자는 판을 칠한 만큼입니다.</text><rect x="40" y="313" width="484" height="48" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="40" y="343.3" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">소리</text><rect x="40" y="373" width="484" height="48" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="40" y="403.3" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">진동</text><rect x="40" y="425" width="560" height="37" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="40" y="439" text-anchor="start" font-size="14" font-weight="400" fill="#5B6178">진동은 지원하는 기기(주로 안드로이드)에서만 나요. 진동이 없어도 소리와 그림으로 모두 알</text><text x="40" y="457.2" text-anchor="start" font-size="14" font-weight="400" fill="#5B6178">수 있어요.</text><rect x="40" y="474" width="484" height="48" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="40" y="504.3" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">움직임 줄이기</text><rect x="40" y="534" width="560" height="24" fill="none" stroke="#C8A" stroke-dasharray="3 5"/><text x="40" y="552" text-anchor="start" font-size="18" font-weight="400" fill="#262B40">언어</text><rect x="536" y="322.6" width="64" height="28.799999999999997" rx="14.399999999999999" fill="#6474CF"/><circle cx="585.6" cy="337" r="11.52" fill="#FFFFFF"/><rect x="536" y="382.6" width="64" height="28.799999999999997" rx="14.399999999999999" fill="#6474CF"/><circle cx="585.6" cy="397" r="11.52" fill="#FFFFFF"/><rect x="536" y="483.6" width="64" height="28.799999999999997" rx="14.399999999999999" fill="#6474CF"/><circle cx="585.6" cy="498" r="11.52" fill="#FFFFFF"/><rect x="40" y="564" width="105" height="48" rx="24" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="92.5" y="594.3" text-anchor="middle" font-size="18" fill="#262B40">한국어</text><rect x="157" y="564" width="105" height="48" rx="24" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="209.5" y="594.3" text-anchor="middle" font-size="18" fill="#262B40">English</text><rect x="40" y="636" width="171" height="48" rx="24" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><text x="125.5" y="666.3" text-anchor="middle" font-size="18" fill="#262B40">기록 지우기</text><circle cx="576" cy="36" r="23" fill="#FFFFFF" stroke="#D3D9E8" stroke-width="1.5"/><g transform="translate(558 18) scale(0.750)"><path d="M15 15 L33 33 M33 15 L15 33" fill="none" stroke="#262B40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g><text x="6" y="692" font-size="10" fill="#5B6178">보호자 640x360 · 내용 높이 696px → 세로 스크롤 · 점선 = 글 자리</text></svg>