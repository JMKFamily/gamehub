<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
<!-- 그림 카드 다시 보기 버튼 48x48 (round 2 R6, D6 반려 대체): 둥근 네모 테두리 안에 칸 3개(작은 둥근 네모) + 칸 사이 작은 삼각형 2개. hud 단색, 노랑·공·별 없음. 바탕 = 그 레벨 bgFar + trackEdge 1.5 (빌드가 바탕 네모를 지우고 CSS 로 그림) -->
