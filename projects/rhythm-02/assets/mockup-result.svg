<!-- 클리어 결과 640x360: 왼쪽 위 = 끝 구름(공이 그 속에 있음, 섞기 끝색 clearCloud = cloud·accent 35 % — 등급 칸 진한 accent 와 다른 연한 색, N11). 레벨 이름(작은 줄) → 클리어 제목 한 줄 → 등급 3칸(예: 구름 둘, 빈 칸 점선, 늘 3칸, 1-2 D12) → 레벨 고르기 · 다시 · 다음(64×64, 간격 48). L10 은 다음 없음. 연습 클리어는 등급 3칸 대신 깃발 1개. 일반 실패에는 이 화면 없음. tools/art/icons.mjs 생성, 손으로 고치지 않음. 빨간 점선 상자·글자 = 글 자리 표시(빌드에는 그 키의 문구, 치수 표시 아님) -->
