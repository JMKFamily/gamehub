<!-- 클리어 결과 640x360: 왼쪽 위 = 끝 구름(공이 그 속에 있음, 섞기 끝색 clearCloud = cloud·accent 35 % — 등급 칸 진한 accent 와 다른 연한 색, N11). 레벨 이름(작은 줄) → 클리어 제목 한 줄 → 등급 3칸(예: 구름 둘, 빈 칸 점선, 늘 3칸, 1-2 D12) → **정확도 %(작은 북 + 다리 밑 표시 표지 + 큰 숫자 26 px, 신기록이면 금빛 꺾쇠 표지) → 최고 콤보(콤보 점 줄 표지 + 숫자 18 px)** — 크기 순서 구름 등급 > 정확도 > 최고 콤보(2026-11-17 판정 이름·% 지시, layout.json result_screen) → 레벨 고르기 · 다시 · 다음(64×64, 간격 48). 정확도·최고 콤보는 일반 모드 클리어만(연습 클리어는 등급 3칸 대신 깃발 1개, 정확도 없음). L10 은 다음 없음. 일반 실패에는 이 화면 없음. 숫자 92%·23 은 예시. tools/art/icons.mjs 생성, 손으로 고치지 않음. 빨간 점선 상자·글자 = 글 자리 표시(빌드에는 그 키의 문구, 치수 표시 아님) -->
