<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
<!-- 소리 맞추기 360x640(어른용): 큰 북 위 앉은 공은 정지(박에 맞춰 움직이지 않음, insights rhythm-01). 들리는 소리는 받침 쉼과 같은 콩(rest_a, 한 높이). 탭할 때만 북 톡 + 점 1개 참. 점 8개 × 2줄(balance calibration 횟수, 예: 첫 줄 5번 침). 끝나면 sync_done / sync_kept / sync_redo. tools/art/icons.mjs 생성, 손으로 고치지 않음. 빨간 점선 상자·글자 = 글 자리 표시(빌드에는 그 키의 문구, 치수 표시 아님) -->
