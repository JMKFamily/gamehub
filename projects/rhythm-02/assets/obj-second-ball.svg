<!-- 두 공 구절(L6·L9 등)의 공 2. 왼쪽 들어옴 = 받침 쉼 동안 화면 오른쪽 밖 바닥에서 굴러와 북 오른쪽 옆에서 낮게 깡충(≤ 0.5d, 소리 없음) 가죽 오른쪽 자리(+0.78d)에 앉음, 공 1 은 왼쪽 자리(−0.78d)로 미끄러짐. 오른쪽 나감 = 착지 뒤 북 오른쪽 끝에서 굴러 떨어져 화면 밖으로, 공 1 은 가운데로. 점선 = 지나온 길(목업 표시). tools/art/cards.mjs 생성 -->
