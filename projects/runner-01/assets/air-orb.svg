<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 120 120" width="120" height="120">
  <!-- 공중 재점프(G6 울림 고리): 속이 빈 고리. viewBox는 칸(0~100)보다 0.1 타일씩 넓은 1.2x1.2 = 트리거 크기. 바깥 점선 궤도(r 0.58)가 트리거 범위를 보여 줌 -->
  <circle cx="50" cy="50" r="58" fill="none" stroke="#5FE0C0" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="33" fill="none" stroke="#0D0F14" stroke-width="16"/>
  <circle cx="50" cy="50" r="33" fill="none" stroke="#5FE0C0" stroke-width="10"/>
  <circle cx="50" cy="50" r="8" fill="#5FE0C0" stroke="#0D0F14" stroke-width="3"/>
</svg>
