<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 레벨 카드 10 대표 오브젝트 "해" (30-art 5-5, round-3). 지면(y 100) 위에 떠 있는 꽉 찬 원 + 둥근 끝 빛살 5개.
       북 발판(땅에 붙은 반원 돔)과 실루엣이 달라지도록: 원 아래 끝(y 74)과 지면 사이 26 단위 틈, 위·옆으로 빛살.
       색 = level10 cardTint #E59CF0, 외곽선 outline #0D0F14. player 노랑·hazard 산호·뾰족한 삼각 빛살은 쓰지 않음 -->
  <g stroke-linecap="round">
    <g stroke="#0D0F14" stroke-width="13">
      <line x1="50" y1="12" x2="50" y2="4"/><line x1="26" y1="22" x2="20" y2="16"/><line x1="74" y1="22" x2="80" y2="16"/>
      <line x1="16" y1="46" x2="7" y2="46"/><line x1="84" y1="46" x2="93" y2="46"/>
    </g>
    <g stroke="#E59CF0" stroke-width="7">
      <line x1="50" y1="12" x2="50" y2="4"/><line x1="26" y1="22" x2="20" y2="16"/><line x1="74" y1="22" x2="80" y2="16"/>
      <line x1="16" y1="46" x2="7" y2="46"/><line x1="84" y1="46" x2="93" y2="46"/>
    </g>
  </g>
  <circle cx="50" cy="46" r="26" fill="#E59CF0" stroke="#0D0F14" stroke-width="4"/>
</svg>
