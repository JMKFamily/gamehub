<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 콤보 단계 표지 (30-art 5-8-1, round-3): 아래가 맞춰진 세로 막대 4개, 높이 25/50/75/100 %.
       닿은 단계(5·10·15·20) 막대 = 불투명, 아직 안 닿은 막대 = 같은 색 35 %. 외곽선 없음, 원·고리·삼각·꺾쇠 아님.
       예시는 2단계(10~14 연속). 빌드에서는 색 comboNum, 전체 alpha는 5-8-1 표를 따름 -->
  <g fill="#F4F0E8">
    <rect x="4" y="75" width="20" height="25" rx="4"/>
    <rect x="28" y="50" width="20" height="50" rx="4"/>
    <rect x="52" y="25" width="20" height="75" rx="4" fill-opacity="0.35"/>
    <rect x="76" y="0" width="20" height="100" rx="4" fill-opacity="0.35"/>
  </g>
</svg>
