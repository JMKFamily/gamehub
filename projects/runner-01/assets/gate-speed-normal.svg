<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 300" width="100" height="300">
  <!-- 속도 변경 게이트(G8 템포 문) normal: 1x3 타일 캡슐 테. 색(gateNormal) + 둥근 꺾쇠 개수(느림1/보통2/빠름3)로 이중 구분. 통과형, 충돌 없음 -->
  <!-- round-3 (30-art 부록 B-4): 캡슐 안쪽에 그 프레임의 배경 바탕색(bg~bgPulse 펄스 값)을 불투명으로 먼저 깔아 뒤 배경 도형(가로 막대 등)을 가림. #161E33은 level5 bg 예시 -->
  <rect x="18" y="6" width="64" height="288" rx="32" fill="#161E33"/>
  <rect x="18" y="6" width="64" height="288" rx="32" fill="#ECE6D8" fill-opacity="0.12" stroke="#ECE6D8" stroke-width="8"/>
  <circle cx="50" cy="40" r="7" fill="#ECE6D8"/>
  <circle cx="50" cy="260" r="7" fill="#ECE6D8"/>
  <polyline points="31,126 51,150 31,174" fill="none" stroke="#ECE6D8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="49,126 69,150 49,174" fill="none" stroke="#ECE6D8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
