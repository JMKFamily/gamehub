<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 자동 점프 발판(G5 북 발판): 반타원 북 가죽(높이 0.25 타일 = 트리거 높이) + 위로 퍼지는 파동 호 2개(장식, 판정 없음). 트리거 x10~90, y75~100 -->
